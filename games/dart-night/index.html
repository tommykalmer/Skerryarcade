<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dart Night: 301 darts against the bot or a friend</title>
<meta name="description" content="Steady your hand and throw. Play 301 darts against three bar rivals, a friend on the same device, or race Around the Clock.">
<meta name="theme-color" content="#14110F">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<script src="/assets/skerry-sdk.js"></script>
<style>
  :root{
    --ink:#14110F; --panel:rgba(32,26,22,.9); --raise:#3A2F27; --line:rgba(255,226,190,.14);
    --text:#FFF6EA; --muted:#C2AE98; --sun:#FFD23F; --sun-ink:#231A00; --red:#E8483F; --green:#2FB36B; --teal:#46E0BE;
    --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Familjen Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:500 16px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  [hidden]{display:none!important}

  .hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:stretch;pointer-events:none;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
  .hud > *{pointer-events:auto}
  .pl{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 12px 9px;display:grid;gap:2px;transition:box-shadow .2s,transform .2s;opacity:.72}
  .pl.on{opacity:1;box-shadow:0 0 0 2px var(--c),0 10px 30px -10px var(--c);transform:translateY(1px)}
  .pl .top{display:flex;align-items:center;gap:7px;font:700 .78rem/1.1 var(--f-display);white-space:nowrap;overflow:hidden}
  .pl .top i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .pl .top .legs{margin-left:auto;display:flex;gap:3px}
  .pl .top .legs b{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c)}
  .pl .top .legs b.won{background:var(--c)}
  .pl .rem{font:800 clamp(1.7rem,7vw,2.4rem)/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .pl .sub{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);min-height:18px}
  .pl .darts{display:flex;gap:3px}
  .pl .darts span{width:6px;height:14px;border-radius:3px;background:var(--c)}
  .pl .darts span.used{background:rgba(255,255,255,.15)}
  .ibtns{display:grid;gap:6px}
  .ibtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
  .ibtn svg{width:19px;height:19px}
  .co{position:fixed;left:50%;transform:translateX(-50%);top:calc(112px + env(safe-area-inset-top,0px));font:700 .8rem/1 var(--f-display);color:var(--sun-ink);background:var(--sun);padding:8px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px -8px rgba(255,210,63,.7)}
  .hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.85rem;color:var(--muted);pointer-events:none;transition:opacity .4s}

  .screen{position:fixed;inset:0;display:flex;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(110% 70% at 50% 15%,rgba(255,170,90,.12),transparent 60%),rgba(12,9,7,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
  .card{margin:auto;width:min(440px,100%);display:grid;gap:14px;justify-items:center;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.93);opacity:0}to{transform:none;opacity:1}}
  .logo{margin:0;font:800 clamp(2.5rem,12vw,3.5rem)/.9 var(--f-display);letter-spacing:-.03em;color:#FFE3B0;text-shadow:0 0 22px rgba(255,140,60,.55),0 0 2px #fff}
  .logo span{display:block;font-size:.42em;letter-spacing:.42em;margin-top:.35em;color:var(--red);text-shadow:0 0 16px rgba(232,72,63,.8)}
  .lead{margin:0;color:#E8D6C0;max-width:32ch}
  .rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  .rival{position:relative;display:grid;gap:4px;justify-items:center;padding:12px 6px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);transition:transform .12s}
  .rival:active{transform:scale(.96)}
  .rival .face{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 1.1rem/1 var(--f-display);color:#231A00}
  .rival b{font:700 .8rem/1.1 var(--f-display)}
  .rival small{font-size:.72rem;color:var(--muted)}
  .rival.locked{opacity:.45}
  .rival .star{position:absolute;top:6px;right:8px;color:var(--sun);font-size:.9rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:18px;font:800 .98rem/1 var(--f-display);transition:transform .12s,box-shadow .12s}
  .btn svg{width:18px;height:18px}
  .btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 #C89A00,0 14px 30px -8px rgba(255,210,63,.6)}
  .btn.sun:active{transform:translateY(4px);box-shadow:0 2px 0 #C89A00}
  .btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);height:50px;font-size:.88rem}
  .btn.ghost:active{transform:scale(.97)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:.92rem}
  .sw{width:46px;height:28px;border-radius:999px;background:var(--raise);position:relative;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle[aria-checked="true"] .sw{background:var(--green)}
  .toggle[aria-checked="true"] .sw::after{transform:translateX(18px)}
  .label{font:700 .78rem/1 var(--f-display);color:var(--muted);justify-self:start}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  .stat{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 6px;display:grid;gap:2px}
  .stat b{font:800 1.15rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
  .stat small{font-size:.72rem;color:var(--muted)}
  .big{font:800 clamp(1.8rem,8vw,2.6rem)/1.05 var(--f-display);margin:0}
  .note{font-size:.82rem;color:var(--muted);margin:0}
  .pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);font:800 clamp(2.2rem,11vw,3.8rem)/1 var(--f-display);color:#fff;text-shadow:0 4px 30px rgba(255,140,60,.9),0 0 3px #000;opacity:0;pointer-events:none;z-index:4;white-space:nowrap}
  .pop.show{animation:popin 1.3s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;z-index:9;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-height:640px){.lead{display:none}.card{gap:10px}.logo{font-size:2.2rem}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Dartboard"></canvas>
<div class="hud" id="hud" hidden>
  <div class="pl" id="p0"></div>
  <div class="pl" id="p1"></div>
  <div class="ibtns">
    <button class="ibtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <button class="ibtn" id="soundBtn" aria-label="Sound"></button>
  </div>
</div>
<div class="co" id="co" hidden></div>
<div class="hint" id="hint">Press and hold to steady your hand. Let go to throw.</div>
<div class="pop" id="pop"></div>

<div class="screen" id="menu">
  <div class="card">
    <h1 class="logo">DART<br>NIGHT<span>301 · BAR RULES</span></h1>
    <p class="lead">Three darts a turn. Count down from 301 to exactly zero before your rival does.</p>
    <span class="label">Play the bot</span>
    <div class="rivals" id="rivals"></div>
    <div class="row2"><button class="btn ghost" id="duoBtn">2 players</button><button class="btn ghost" id="clockBtn">Around the Clock</button></div>
    <button class="toggle" id="doubleBtn" role="switch" aria-checked="true"><span>Finish on a double</span><span class="sw"></span></button>
    <p class="note" id="menuNote">Best of 3 legs. Beat a rival to unlock the next.</p>
  </div>
</div>

<div class="screen" id="over" hidden>
  <div class="card">
    <p class="note" id="overSub">Match over</p>
    <h2 class="big" id="overTitle">You win!</h2>
    <div class="stats" id="overStats"></div>
    <button class="btn sun" id="againBtn">Rematch</button>
    <div class="row2"><button class="btn ghost" id="shareBtn">Share</button><button class="btn ghost" id="menuBtn">Menu</button></div>
  </div>
</div>

<div class="screen" id="pause" hidden>
  <div class="card">
    <h2 class="big">Paused</h2>
    <button class="btn sun" id="resumeBtn">Resume</button>
    <div class="row2"><button class="btn ghost" id="restartBtn">Restart</button><button class="btn ghost" id="quitBtn">Menu</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const SDK = window.SkerrySDK || { gameplayStart(){}, gameplayStop(){}, happytime(){}, levelEnd(){}, event(){},
  save(k, v){ try { localStorage.setItem("dartnight." + k, JSON.stringify(v)); } catch (e) {} },
  load(k, d){ try { const v = localStorage.getItem("dartnight." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } } };
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const SHARE_URL = "https://skerryarcade.com/dart-night/";

/* ---------------- board geometry (millimetres, regulation sizes) ---------------- */
const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const R = { bull: 6.35, outer: 15.9, tIn: 99, tOut: 107, dIn: 162, dOut: 170, num: 196, edge: 228 };
function scoreAt(x, y){                     // x right, y down, mm from centre
  const r = Math.hypot(x, y);
  if (r <= R.bull) return { v: 50, mult: 2, n: 25, label: "BULL" };
  if (r <= R.outer) return { v: 25, mult: 1, n: 25, label: "25" };
  if (r > R.dOut) return { v: 0, mult: 0, n: 0, label: "MISS" };
  let a = Math.atan2(x, -y) * 180 / Math.PI; if (a < 0) a += 360;
  const n = ORDER[Math.floor(((a + 9) % 360) / 18)];
  if (r >= R.tIn && r <= R.tOut) return { v: n * 3, mult: 3, n, label: "T" + n };
  if (r >= R.dIn) return { v: n * 2, mult: 2, n, label: "D" + n };
  return { v: n, mult: 1, n, label: String(n) };
}
function targetPoint(t){                    // t like "T20", "D16", "S5", "BULL", "25"
  if (t === "BULL") return { x: 0, y: 0 };
  if (t === "25") return { x: 0, y: -11 };
  const kind = t[0], n = +t.slice(1), i = ORDER.indexOf(n), a = i * 18 * Math.PI / 180;
  const r = kind === "T" ? 103 : kind === "D" ? 166 : 135;
  return { x: Math.sin(a) * r, y: -Math.cos(a) * r };
}

/* ---------------- checkouts: best finish for every score, up to 3 darts ---------------- */
const THROWS = [];
for (let n = 20; n >= 1; n--) THROWS.push({ t: "T" + n, v: n * 3, dbl: false });
THROWS.push({ t: "BULL", v: 50, dbl: true }, { t: "25", v: 25, dbl: false });
for (let n = 20; n >= 1; n--) THROWS.push({ t: "S" + n, v: n, dbl: false });
const DOUBLES = [20, 16, 18, 12, 10, 8, 19, 17, 15, 14, 13, 11, 9, 7, 6, 5, 4, 3, 2, 1].map(n => ({ t: "D" + n, v: n * 2, dbl: true })).concat([{ t: "BULL", v: 50, dbl: true }]);
const finishCache = {};
function checkout(rem, darts, needDouble){
  const key = rem + ":" + darts + ":" + needDouble;
  if (key in finishCache) return finishCache[key];
  let res = null;
  const lasts = needDouble ? DOUBLES : THROWS.concat(DOUBLES);
  for (const l of lasts) if (l.v === rem) { res = [l.t]; break; }
  if (!res && darts >= 2) for (const a of THROWS.concat(DOUBLES)) { if (a.v >= rem) continue; const rest = checkout(rem - a.v, 1, needDouble); if (rest) { res = [a.t].concat(rest); break; } }
  if (!res && darts >= 3) for (const a of THROWS) { if (a.v >= rem) continue; const rest = checkout(rem - a.v, 2, needDouble); if (rest && rest.length === 2) { res = [a.t].concat(rest); break; } }
  return (finishCache[key] = res);
}
const pretty = t => t === "BULL" ? "Bull" : t[0] === "S" ? t.slice(1) : t;

/* ---------------- saved data ---------------- */
let save = Object.assign({ beaten: {}, sound: true, double: true, clockBest: 0, best180: 0, bestCheckout: 0, matches: 0 }, SDK.load("save", {}));
const store = () => SDK.save("save", save);

/* ---------------- audio ---------------- */
const Sound = (() => {
  let ctx = null, master = null;
  function init(){ if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = save.sound ? .9 : 0; master.connect(ctx.destination); } catch (e) { ctx = null; } }
  function noise(t, dur, vol, f, type = "bandpass", q = 1){
    const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
  }
  function tone(f, t, dur, type, vol, to){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
  }
  const ok = () => ctx && save.sound;
  return { init,
    setOn(on){ if (master) master.gain.setTargetAtTime(on ? .9 : 0, ctx.currentTime, .02); },
    whoosh(){ if (!ok()) return; noise(ctx.currentTime, .18, .12, 1800, "bandpass", .7); },
    thud(power){ if (!ok()) return; const t = ctx.currentTime; noise(t, .06, .5 * power, 900, "lowpass"); tone(140, t, .1, "sine", .35 * power, 70); noise(t, .02, .2, 4000); },
    miss(){ if (!ok()) return; const t = ctx.currentTime; noise(t, .12, .3, 400, "lowpass"); tone(90, t, .15, "triangle", .2, 60); },
    good(level){ if (!ok()) return; const t = ctx.currentTime; [523, 659, 784, 1046].slice(0, level + 1).forEach((f, i) => tone(f, t + i * .07, .35, "triangle", .14)); },
    cheer(){ if (!ok()) return; const t = ctx.currentTime; noise(t, 1.4, .18, 1200, "bandpass", .4); [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * .08, .7, "triangle", .12)); },
    bust(){ if (!ok()) return; const t = ctx.currentTime; tone(220, t, .25, "sawtooth", .08, 140); tone(165, t + .18, .3, "sawtooth", .08, 100); },
    pull(){ if (!ok()) return; noise(ctx.currentTime, .05, .15, 2500); }
  };
})();
const buzz = p => { try { if (save.sound && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p); } catch (e) {} };

/* ---------------- canvas & layout ---------------- */
const cv = $("game"), ctx = cv.getContext("2d");
let DPR = 1, VW = 0, VH = 0, CX = 0, CY = 0, K = 1;    // K = px per mm
let boardImg = null, wallImg = null;
function safeTop(){ let p = $("satProbe"); if (!p) { p = document.createElement("div"); p.id = "satProbe"; p.style.cssText = "position:fixed;top:0;height:env(safe-area-inset-top,0px);width:0;visibility:hidden"; document.body.appendChild(p); } return p.offsetHeight || 0; }
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5); VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  const top = 150 + safeTop(), bottom = 46;
  const size = Math.min(VW - 24, VH - top - bottom);
  K = size / (R.edge * 2); CX = VW / 2; CY = top + (VH - top - bottom) / 2;
  wallImg = drawWall(); boardImg = drawBoard();
}
function drawWall(){
  const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height; const g = c.getContext("2d"); g.scale(DPR, DPR);
  g.fillStyle = "#1E1814"; g.fillRect(0, 0, VW, VH);
  // wooden panels
  const pw = 54;
  for (let x = -((VW / 2) % pw); x < VW; x += pw) {
    const gr = g.createLinearGradient(x, 0, x + pw, 0); gr.addColorStop(0, "#2A211B"); gr.addColorStop(.5, "#31271F"); gr.addColorStop(1, "#261E18");
    g.fillStyle = gr; g.fillRect(x, 0, pw - 2, VH);
    g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1;
    for (let k = 0; k < 6; k++) { g.beginPath(); const yy = (k * 97 + x * 3) % VH; g.moveTo(x + 6, yy); g.bezierCurveTo(x + 20, yy + 30, x + 34, yy - 20, x + pw - 8, yy + 15); g.stroke(); }
  }
  // spotlight
  const sp = g.createRadialGradient(CX, CY - R.edge * K * .3, 10, CX, CY, Math.max(VW, VH) * .75);
  sp.addColorStop(0, "rgba(255,200,130,.30)"); sp.addColorStop(.45, "rgba(255,170,90,.08)"); sp.addColorStop(1, "rgba(0,0,0,.55)");
  g.fillStyle = sp; g.fillRect(0, 0, VW, VH);
  // cabinet surround
  g.save(); g.translate(CX, CY);
  g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 40 * K; g.shadowOffsetY = 12 * K;
  g.fillStyle = "#15100D"; g.beginPath(); g.arc(0, 0, R.edge * K + 10, 0, 7); g.fill(); g.restore();
  return c;
}
function drawBoard(){
  const size = Math.ceil(R.edge * 2 * K * DPR) + 4, c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), m = size / 2, k = K * DPR;
  g.translate(m, m);
  // black outer ring with numbers
  g.fillStyle = "#121212"; g.beginPath(); g.arc(0, 0, R.edge * k, 0, 7); g.fill();
  const seg = (r0, r1, i, col) => { const a0 = (i * 18 - 9 - 90) * Math.PI / 180, a1 = a0 + 18 * Math.PI / 180;
    g.beginPath(); g.arc(0, 0, r1 * k, a0, a1); g.arc(0, 0, r0 * k, a1, a0, true); g.closePath(); g.fillStyle = col; g.fill(); };
  for (let i = 0; i < 20; i++) {
    const dark = i % 2 === 0;
    seg(R.outer, R.tIn, i, dark ? "#1B1B1B" : "#F1E3C6");
    seg(R.tOut, R.dIn, i, dark ? "#1B1B1B" : "#F1E3C6");
    seg(R.tIn, R.tOut, i, dark ? "#D7322C" : "#1E9A55");
    seg(R.dIn, R.dOut, i, dark ? "#D7322C" : "#1E9A55");
  }
  // sisal texture
  g.save(); g.globalAlpha = .07; for (let i = 0; i < 2200; i++) { const a = Math.random() * 6.28, r = Math.sqrt(Math.random()) * R.dOut * k; g.fillStyle = Math.random() < .5 ? "#000" : "#fff"; g.fillRect(Math.cos(a) * r, Math.sin(a) * r, 1.2 * DPR, 1.2 * DPR); } g.restore();
  g.fillStyle = "#1E9A55"; g.beginPath(); g.arc(0, 0, R.outer * k, 0, 7); g.fill();
