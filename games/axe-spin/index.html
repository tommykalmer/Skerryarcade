<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Axe Spin: throw axes, beat the six bosses</title>
<meta name="description" content="Tap to throw. Stick every axe in the spinning shield without hitting the ones already there. Beat six bosses, take on the daily gauntlet or duel a friend.">
<meta name="theme-color" content="#1A1230">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<script src="/assets/skerry-sdk.js"></script>
<style>
  :root{
    --ink:#170F2A; --panel:rgba(30,20,52,.86); --line:rgba(235,215,255,.16);
    --text:#FFF7F0; --muted:#C8B8DE; --sun:#FFD23F; --sun-ink:#231A00; --mint:#46E0BE; --coral:#FF6B5A;
    --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Familjen Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:500 16px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  [hidden]{display:none!important}

  .hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:2;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .hud > *{pointer-events:auto}
  .sc{display:grid;gap:1px;min-width:70px}
  .sc small{font:700 .64rem/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
  .sc b{font:800 1.6rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
  .mid{flex:1;display:grid;justify-items:center;gap:6px;min-width:0}
  .stage{font:800 .95rem/1 var(--f-display);letter-spacing:.08em;white-space:nowrap}
  .dots{display:flex;gap:6px;align-items:center}
  .dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
  .dots i.done{background:var(--mint)}
  .dots i.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  .dots i.boss{width:16px;height:16px;border-radius:5px;background:rgba(255,107,90,.35);display:grid;place-items:center}
  .dots i.boss.now{background:var(--coral);box-shadow:0 0 0 3px rgba(255,107,90,.35)}
  .dots i.boss.done{background:var(--mint)}
  .side{display:grid;gap:6px;justify-items:end}
  .coins{display:flex;align-items:center;gap:6px;padding:7px 11px 7px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:800 .88rem/1 var(--f-display);font-variant-numeric:tabular-nums}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF2A8,#FFD23F 45%,#E0A400);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
  .ibtns{display:flex;gap:6px}
  .ibtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
  .ibtn svg{width:18px;height:18px}
  .turn{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:800 .8rem/1 var(--f-display);padding:8px 14px;border-radius:999px;background:var(--c,#FFD23F);color:#1E1400;pointer-events:none;z-index:3;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .turn.pulse{animation:tp .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes tp{0%{transform:translateX(-50%) scale(.8)}100%{transform:translateX(-50%) scale(1)}}
  .pop{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font:800 clamp(1.6rem,8vw,2.6rem)/1.05 var(--f-display);color:#fff;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.55);opacity:0;pointer-events:none;z-index:4;white-space:nowrap}
  .pop small{display:block;font:700 .8rem/1 var(--f-display);letter-spacing:.24em;margin-bottom:8px;color:var(--coral)}
  .pop.show{animation:popin 1.6s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}26%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
  .hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font:600 .92rem/1.2 var(--f-body);color:#EDE3FF;pointer-events:none;transition:opacity .5s;z-index:2}

  .screen{position:fixed;inset:0;display:flex;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(100% 60% at 50% 10%,rgba(255,140,90,.18),transparent 60%),rgba(14,8,28,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
  .card{margin:auto;width:min(420px,100%);display:grid;gap:13px;justify-items:center;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  .logo{margin:0;font:800 clamp(2.8rem,14vw,4rem)/.88 var(--f-display);letter-spacing:-.03em;color:#fff;text-shadow:0 5px 0 #B33A2A,0 14px 40px rgba(255,90,60,.4)}
  .logo span{display:block;font-size:.32em;letter-spacing:.4em;margin-top:.75em;color:var(--sun);text-shadow:none}
  .lead{margin:0;color:#E6DAF5;max-width:31ch}
  .goal{width:100%;display:grid;gap:8px;padding:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .goal p{margin:0;font:700 .7rem/1 var(--f-display);letter-spacing:.16em;color:var(--muted);text-align:left}
  .bosses{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .boss{display:grid;gap:4px;justify-items:center;font:700 .58rem/1.1 var(--f-display);color:var(--muted)}
  .boss i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.05rem;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12)}
  .boss.beat i{border-color:var(--mint);background:rgba(70,224,190,.18)}
  .boss.next i{border-color:var(--coral);background:rgba(255,107,90,.2);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:99px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:18px;font:800 1rem/1 var(--f-display);transition:transform .12s,box-shadow .12s}
  .btn svg{width:18px;height:18px}
  .btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 #C89A00,0 14px 30px -8px rgba(255,210,63,.55)}
  .btn.sun:active{transform:translateY(4px);box-shadow:0 2px 0 #C89A00}
  .btn.sun span{display:grid;gap:3px}
  .btn.sun small{font:600 .74rem/1 var(--f-body);opacity:.8}
  .btn.daily{height:auto;min-height:56px;padding:9px 14px;background:linear-gradient(135deg,#FF6B5A,#FFA53D);color:#2A0E00;box-shadow:0 5px 0 #A8341F}
  .btn.daily:active{transform:translateY(3px);box-shadow:0 2px 0 #A8341F}
  .btn.daily span{display:grid;gap:3px}
  .btn.daily b{font:800 .95rem/1 var(--f-display)}
  .btn.daily small{font:600 .74rem/1.1 var(--f-body);opacity:.85}
  .btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);height:50px;font-size:.88rem}
  .btn.cont{background:linear-gradient(135deg,#FFD23F,#FF9F43);color:#2A1600;box-shadow:0 5px 0 #C27200}
  .btn.cont:disabled{opacity:.45;filter:grayscale(.5)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .big{font:800 clamp(2.2rem,11vw,3.3rem)/1.02 var(--f-display);margin:0}
  .kicker{font:700 .76rem/1 var(--f-display);letter-spacing:.2em;color:var(--muted);margin:0}
  .note{font-size:.8rem;color:var(--muted);margin:0}
  .skins{width:100%;display:grid;gap:8px}
  .skins p{margin:0;font:700 .7rem/1 var(--f-display);letter-spacing:.16em;color:var(--muted)}
  .sk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .sb{position:relative;width:46px;height:58px;border-radius:14px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);display:grid;place-items:center;align-content:center;gap:2px}
  .sb.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
  .sb canvas{width:34px;height:34px}
  .sb em{font:700 .58rem/1 var(--f-display);font-style:normal;color:var(--muted)}
  .sb.locked canvas{filter:grayscale(1) brightness(.5)}
  .unlock{font:700 .85rem/1.3 var(--f-body);color:#fff;background:linear-gradient(90deg,rgba(70,224,190,.25),rgba(255,210,63,.25));border:1px solid var(--line);padding:10px 14px;border-radius:14px;width:100%}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;z-index:9;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .vs{width:100%;display:grid;gap:8px}
  .vs .vlabel{font:700 .7rem/1 var(--f-display);letter-spacing:.16em;color:var(--muted);text-align:left;margin:4px 0 0}
  .rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rival{position:relative;display:grid;gap:4px;justify-items:center;padding:10px 6px 9px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .12s}
  .rival:active{transform:scale(.96)}
  .rival .face{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 1rem/1 var(--f-display);color:#1E1400;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .rival b{font:700 .78rem/1.1 var(--f-display)}
  .rival small{font-size:.68rem;color:var(--muted);line-height:1.2}
  .rival.locked{opacity:.45}
  .rival .star{position:absolute;top:5px;right:8px;color:var(--sun);font-size:.85rem}
  .btn.duo2{background:rgba(255,255,255,.08);border:1px solid var(--line);height:50px;font-size:.88rem}
  .btn.duo2 svg{width:20px;height:20px}

  @media (max-height:700px){.lead{display:none}.card{gap:9px}.logo{font-size:2.4rem}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Axe Spin"></canvas>
<div class="hud" id="hud" hidden>
  <div class="sc"><small id="scLbl">SCORE</small><b id="score">0</b></div>
  <div class="mid"><div class="stage" id="stage">STAGE 1</div><div class="dots" id="dots"></div></div>
  <div class="side">
    <div class="ibtns"><button class="ibtn" id="soundBtn" aria-label="Sound on or off"></button><button class="ibtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button></div>
    <div class="coins"><i class="coin"></i><span id="coins">0</span></div>
  </div>
</div>
<div class="turn" id="turn" hidden></div>
<div class="pop" id="pop"></div>
<div class="hint" id="hint" hidden>Tap anywhere to throw</div>

<div class="screen" id="menu">
  <div class="card">
    <h1 class="logo">AXE<br>SPIN<span>BEAT THE SIX BOSSES</span></h1>
    <p class="lead">Tap to throw. Every axe has to stick in the spinning shield, and none may hit an axe that is already there.</p>
    <div class="goal">
      <p id="goalTxt">THE BOSSES</p>
      <div class="bosses" id="bosses"></div>
      <div class="bar"><b id="bar" style="width:0%"></b></div>
    </div>
    <button class="btn sun" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg><span><b id="playLbl">Play</b><small id="playSub">Stage 1</small></span></button>
    <button class="btn daily" id="dailyBtn"><span><b id="dailyName">Daily gauntlet</b><small id="dailySub">8 stages, one life, same for everyone</small></span></button>
    <div class="vs">
      <p class="vlabel">VERSUS</p>
      <div class="rivals" id="rivals"></div>
      <button class="btn duo2" id="duoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5M13.6 14.4c.9-.6 1.9-.9 2.9-.9 2.3 0 4.2 1.5 4.7 4.5"/></svg>2 players, one shield</button>
    </div>
    <div class="skins"><p>AXES</p><div class="sk" id="skins"></div></div>
    <p class="note" id="skinNote">Beat a boss to win its axe.</p>
  </div>
</div>
<div class="screen" id="pause" hidden>
  <div class="card">
    <h2 class="big" style="font-size:2.2rem">Paused</h2>
    <button class="btn sun" id="resumeBtn">Resume</button>
    <div class="row2"><button class="btn ghost" id="restartBtn">Restart</button><button class="btn ghost" id="quitBtn">Menu</button></div>
  </div>
</div>
<div class="screen" id="over" hidden>
  <div class="card">
    <p class="kicker" id="overKick">STAGE 1</p>
    <h2 class="big" id="overBig">Clang!</h2>
    <p class="note" id="overSub"></p>
    <div class="unlock" id="overUnlock" hidden></div>
    <button class="btn cont" id="contBtn" hidden><span>Try this stage again · <b id="contCost">40</b> coins</span></button>
    <button class="btn sun" id="againBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg><span id="againLbl">Play again</span></button>
    <div class="row2"><button class="btn ghost" id="shareBtn">Share</button><button class="btn ghost" id="menuBtn">Menu</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const SDK = window.SkerrySDK || { gameplayStart(){}, gameplayStop(){}, happytime(){}, levelEnd(){}, event(){},
  save(k, v){ try { localStorage.setItem("axespin." + k, JSON.stringify(v)); } catch (e) {} },
  load(k, d){ try { const v = localStorage.getItem("axespin." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } } };
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const wrap = a => ((a % TAU) + TAU) % TAU;
const adiff = (a, b) => { const d = Math.abs(wrap(a) - wrap(b)); return Math.min(d, TAU - d); };
const SHARE_URL = "https://skerryarcade.com/axe-spin/";

/* ---------------- rules ----------------
   Angles are measured on the shield. An axe sticks at the bottom of the shield; two axes closer than
   GAP radians hit each other. 30 stages in six chapters, a boss at the end of each; endless after that. */
const GAP = .18, APPLE_GAP = .2, FLY = .1, CHAPTERS = 6, LAST = CHAPTERS * 5;
const BOSSES = [
  { name: "The Old Oak", icon: "🌳", wood: [28, 48, 46], ring: "#6B4423", art: "oak" },
  { name: "Troll Shield", icon: "👹", wood: [12, 40, 38], ring: "#3E5A2A", art: "troll" },
  { name: "Iron Wheel", icon: "⚙️", wood: [220, 8, 52], ring: "#3B3F48", art: "iron" },
  { name: "Frost Rune", icon: "❄️", wood: [200, 55, 70], ring: "#5FA8D3", art: "frost" },
  { name: "Storm Drum", icon: "⚡", wood: [265, 30, 38], ring: "#FFD23F", art: "storm" },
  { name: "Giant's Eye", icon: "👁️", wood: [350, 45, 40], ring: "#FF6B5A", art: "eye" },
];
const SKINS = [
  { id: "classic", name: "Classic", head: "#C9D2DC", edge: "#F4F7FA", handle: "#8A5A34", grip: "#3A2A1E", need: null },
  { id: "oak", name: "Oak", head: "#D8B36A", edge: "#FFE7A8", handle: "#5E3B1E", grip: "#2C6E3A", need: 0, cost: 0 },
  { id: "troll", name: "Troll", head: "#7EA06A", edge: "#C8E6A8", handle: "#4A3020", grip: "#7A2A2A", need: 1 },
  { id: "iron", name: "Iron", head: "#6E7682", edge: "#D5DAE2", handle: "#2A2A2E", grip: "#C0392B", need: 2 },
  { id: "frost", name: "Frost", head: "#A8E4FF", edge: "#FFFFFF", handle: "#3A6E9A", grip: "#E8F7FF", need: 3 },
  { id: "storm", name: "Storm", head: "#FFD23F", edge: "#FFF6C2", handle: "#3A2A6E", grip: "#B48CFF", need: 4 },
  { id: "giant", name: "Giant", head: "#FF6B5A", edge: "#FFD0C8", handle: "#2A1010", grip: "#FFD23F", need: 5 },
];

/* ---------------- saves ---------------- */
let save = Object.assign({ best: 0, checkpoint: 1, bosses: 0, coins: 0, games: 0, axes: 0, skin: "classic", sound: true, daily: { day: 0, best: 0 }, streak: { last: 0, n: 0 }, beaten: {} }, SDK.load("save", {}));
const store = () => SDK.save("save", save);
const skinOwned = s => s.need === null || save.bosses > s.need;
let skin = SKINS.find(s => s.id === save.skin && skinOwned(s)) || SKINS[0];

function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const dayNo = () => { const d = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 9, 31)) / 864e5) + 1; };

/* ---------------- stage design ----------------
   Every stage number always builds the same shield, so "stage 17" means the same thing for everyone. */
const PATTERNS = ["steady", "pulse", "swing", "reverse", "stutter", "wobble"];
function omega(p, t){
  const w = p.w;
  switch (p.type) {
    case "steady": return w;
    case "pulse": return w * (1 + .75 * Math.sin(t * p.f));
    case "swing": return w * 1.5 * Math.sin(t * p.f);
    case "reverse": return w * Math.tanh(4 * Math.sin(t * p.f));
    case "stutter": return (t * p.f) % 1 < .62 ? w * 1.7 : w * .12;
    case "wobble": return w * (1 + .35 * Math.sin(t * p.f * 2.3)) * Math.sign(Math.sin(t * p.f * .37) + .3);
    case "boss": return w * (1.1 + .9 * Math.sin(t * p.f)) * Math.tanh(3 * Math.sin(t * p.f * .45 + .6));
  }
  return w;
}
function makeStage(n, seed){
  const r = rng(seed != null ? seed : n * 7919 + 17), boss = n % 5 === 0, ch = Math.min(CHAPTERS - 1, Math.floor((n - 1) / 5)), endless = n > LAST;
  const level = Math.min(n, 60);
  const w = Math.min(1.5 + level * .06, 3.6) * (r() < .5 ? -1 : 1);
  let pat;
  if (boss) pat = { type: n === 5 ? "pulse" : "boss", w: w * 1.05, f: .9 + r() * .6 };
  else if (n <= 2) pat = { type: "steady", w: w * .85, f: 1 };
  else { const pool = PATTERNS.slice(0, Math.min(PATTERNS.length, 2 + Math.floor(n / 3))); pat = { type: pool[Math.floor(r() * pool.length)], w, f: .8 + r() * 1.1 }; }
  const axes = boss ? Math.min(14, 8 + ch) : Math.min(12, 5 + Math.floor(n / 3) + (endless ? 1 : 0));
  const pre = [], apples = [];
  const nPre = boss ? Math.min(6, 1 + ch) : Math.min(5, Math.floor((n - 1) / 2.5));
  const free = a => pre.every(p => adiff(p, a) > .55) && apples.every(p => adiff(p, a) > .45);
  for (let k = 0; k < nPre * 8 && pre.length < nPre; k++) { const a = r() * TAU; if (free(a)) pre.push(a); }
  const nApp = boss ? 2 : r() < .55 ? 1 : r() < .3 ? 2 : 0;
  for (let k = 0; k < 40 && apples.length < nApp; k++) { const a = r() * TAU; if (free(a)) apples.push(a); }
  return { n, boss, bossIdx: boss ? (Math.floor(n / 5) - 1) % CHAPTERS : -1, ch, pat, axes, pre, apples };
}

/* ---------------- audio ---------------- */
const Sound = (() => {
  let ctx = null, master = null;
  function init(){ if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }

/* ---------------- the computer thrower ----------------
   It looks ahead at the spinning shield, finds the moment the landing spot has the most room, and lets go.
   Its timing wobbles by a skill-dependent amount, which matters more the faster the shield spins. */

/* ---------------- update ---------------- */
