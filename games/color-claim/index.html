<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Color Claim: take over the board one colour at a time</title>
<meta name="description" content="Pick a colour and swallow every tile of it next to your land. Own more than half the board to win. Play the computer, a friend face to face, or the daily flood puzzle.">
<meta name="theme-color" content="#141A33">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<script src="/assets/skerry-sdk.js"></script>
<style>
  :root{
    --ink:#141A33; --panel:rgba(28,34,66,.9); --line:rgba(210,220,255,.16);
    --text:#F5F7FF; --muted:#A7B0D6; --sun:#FFD23F; --sun-ink:#231A00; --mint:#46E0BE;
    --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Familjen Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:500 16px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  [hidden]{display:none!important}

  .hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;z-index:2;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .sc{flex:1;display:grid;gap:6px;min-width:0}
  .names{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
  .pl{display:flex;align-items:center;gap:7px;min-width:0;font:700 .78rem/1 var(--f-display);transition:opacity .2s}
  .pl.r{flex-direction:row-reverse;text-align:right}
  .pl b{font:800 1.35rem/1 var(--f-display);font-variant-numeric:tabular-nums}
  .pl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
  .pl i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .pl.on i{box-shadow:0 0 0 3px #fff,0 0 14px var(--c);animation:beat 1s ease-in-out infinite}
  .pl.off{opacity:.55}
  @keyframes beat{50%{transform:scale(1.25)}}
  .bar{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar .a,.bar .b{position:absolute;top:0;bottom:0;transition:width .35s cubic-bezier(.3,1.2,.5,1)}
  .bar .a{left:0;background:var(--ca,#FFD23F);border-radius:999px 0 0 999px}
  .bar .b{right:0;background:var(--cb,#46E0BE);border-radius:0 999px 999px 0}
  .bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4)}
  .goal{font:600 .7rem/1 var(--f-body);color:var(--muted);text-align:center}
  .ibtns{display:flex;gap:6px}
  .ibtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
  .ibtn svg{width:18px;height:18px}

  .pal{position:fixed;left:0;right:0;display:flex;justify-content:center;gap:clamp(6px,2.4vw,12px);z-index:2;padding:0 10px;transition:opacity .25s}
  .pal.bot{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .pal.top{top:calc(88px + env(safe-area-inset-top,0px));transform:rotate(180deg)}
  .pal.idle{opacity:.28;pointer-events:none}
  .sw{position:relative;width:clamp(44px,13vw,58px);height:clamp(44px,13vw,58px);border-radius:50%;background:var(--c);display:grid;place-items:center;
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 6px 16px -6px rgba(0,0,0,.5);transition:transform .12s,opacity .2s}
  .sw:active{transform:scale(.9)}
  .sw svg{width:42%;height:42%;color:rgba(0,0,0,.38)}
  .sw[disabled]{opacity:.28;transform:scale(.82)}
  .sw[disabled]::after{content:attr(data-tag);position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font:700 .56rem/1 var(--f-display);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
  .sw .gain{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:#fff;color:#1A1F3A;font:800 .66rem/22px var(--f-display);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .moves{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font:700 .78rem/1 var(--f-display);color:var(--muted);pointer-events:none;z-index:2}
  .pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font:800 clamp(2rem,10vw,3.2rem)/1 var(--f-display);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;z-index:4;white-space:nowrap}
  .pop.show{animation:popin 1.3s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}

  .screen{position:fixed;inset:0;display:flex;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(100% 60% at 50% 10%,rgba(167,123,255,.22),transparent 60%),rgba(12,16,34,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
  .card{margin:auto;width:min(420px,100%);display:grid;gap:13px;justify-items:center;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  .logo{margin:0;font:800 clamp(2.5rem,12.5vw,3.6rem)/.9 var(--f-display);letter-spacing:-.03em;color:#fff}
  .logo em{font-style:normal;background:linear-gradient(90deg,#FF6B5A,#FFD23F,#46E0BE,#4FA8FF,#A77BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo span{display:block;font-size:.34em;letter-spacing:.32em;margin-top:.75em;color:var(--sun)}
  .lead{margin:0;color:#DDE3FA;max-width:31ch}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  .stat{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:grid;gap:2px}
  .stat b{font:800 1.12rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
  .stat small{font-size:.72rem;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:18px;font:800 .98rem/1 var(--f-display);transition:transform .12s,box-shadow .12s}
  .btn svg{width:18px;height:18px}
  .btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 #C89A00,0 14px 30px -8px rgba(255,210,63,.55)}
  .btn.sun:active{transform:translateY(4px);box-shadow:0 2px 0 #C89A00}
  .btn.daily{height:auto;min-height:58px;padding:9px 14px;background:linear-gradient(135deg,#FF6B5A,#A77BFF);color:#fff;box-shadow:0 5px 0 #6B3FC8}
  .btn.daily:active{transform:translateY(3px);box-shadow:0 2px 0 #6B3FC8}
  .btn.daily span{display:grid;gap:3px}
  .btn.daily b{font:800 .95rem/1 var(--f-display)}
  .btn.daily small{font:600 .74rem/1.1 var(--f-body);opacity:.9}
  .btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);height:50px;font-size:.88rem}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .big{font:800 clamp(2.2rem,11vw,3.2rem)/1.02 var(--f-display);margin:0}
  .kicker{font:700 .76rem/1 var(--f-display);letter-spacing:.2em;color:var(--muted);margin:0}
  .note{font-size:.8rem;color:var(--muted);margin:0}
  .result{font:800 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums}
  .unlock{font:700 .85rem/1.3 var(--f-body);background:linear-gradient(90deg,rgba(70,224,190,.22),rgba(255,210,63,.22));border:1px solid var(--line);padding:10px 14px;border-radius:14px;width:100%}
  .trail{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
  .trail i{width:14px;height:14px;border-radius:4px;background:var(--c)}

  .vs{width:100%;display:grid;gap:8px}
  .vs .vlabel{font:700 .7rem/1 var(--f-display);letter-spacing:.16em;color:var(--muted);text-align:left;margin:4px 0 0}
  .rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rival{position:relative;display:grid;gap:4px;justify-items:center;padding:10px 6px 9px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .12s}
  .rival:active{transform:scale(.96)}
  .rival .face{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 1rem/1 var(--f-display);color:#1E1400;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .rival b{font:700 .78rem/1.1 var(--f-display)}
  .rival small{font-size:.68rem;color:var(--muted);line-height:1.2}
  .rival.locked{opacity:.45}
  .rival .star{position:absolute;top:5px;right:8px;color:var(--sun);font-size:.85rem}
  .btn.duo2{background:rgba(255,255,255,.08);border:1px solid var(--line);height:50px;font-size:.88rem}
  .btn.duo2 svg{width:20px;height:20px}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;z-index:9;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-height:680px){.lead{display:none}.card{gap:9px}.logo{font-size:2.2rem}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Color Claim board"></canvas>

<div class="hud" id="hud" hidden>
  <div class="sc">
    <div class="names">
      <div class="pl" id="plA" style="--c:#FFD23F"><i></i><span id="nA">You</span><b id="vA">1</b></div>
      <div class="pl r" id="plB" style="--c:#46E0BE"><i></i><span id="nB">Rival</span><b id="vB">1</b></div>
    </div>
    <div class="bar" id="bar"><div class="a" id="barA"></div><div class="b" id="barB"></div><div class="mid"></div></div>
    <div class="goal" id="goal">Own 41 tiles to win</div>
  </div>
  <div class="ibtns">
    <button class="ibtn" id="soundBtn" aria-label="Sound on or off"></button>
    <button class="ibtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  </div>
</div>
<div class="pal top" id="palB" hidden></div>
<div class="pal bot" id="palA" hidden></div>
<div class="moves" id="movesTxt" hidden></div>
<div class="pop" id="pop"></div>

<div class="screen" id="menu">
  <div class="card">
    <h1 class="logo"><em>COLOR</em><br>CLAIM<span>TAKE THE BOARD</span></h1>
    <p class="lead">Pick a colour and swallow every tile of it next to your land. Own more than half the board to win.</p>
    <div class="stats">
      <div class="stat"><b id="sWins">0</b><small>Wins</small></div>
      <div class="stat"><b id="sStreak">0</b><small>Daily streak</small></div>
      <div class="stat"><b id="sDaily">–</b><small>Today's flood</small></div>
    </div>
    <button class="btn sun" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg><span id="playLbl">Play</span></button>
    <button class="btn daily" id="dailyBtn"><span><b id="dailyName">Daily flood</b><small id="dailySub">Fill the whole board in par or less</small></span></button>
    <div class="vs">
      <p class="vlabel">VERSUS</p>
      <div class="rivals" id="rivals"></div>
      <button class="btn duo2" id="duoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5M13.6 14.4c.9-.6 1.9-.9 2.9-.9 2.3 0 4.2 1.5 4.7 4.5"/></svg>2 players, face to face</button>
    </div>
    <p class="note">You can't pick your own colour or your rival's.</p>
  </div>
</div>

<div class="screen" id="over" hidden>
  <div class="card">
    <p class="kicker" id="overKick">GAME OVER</p>
    <h2 class="big" id="overTitle">You win!</h2>
    <div class="result" id="overScore">48 – 32</div>
    <div class="trail" id="trail" hidden></div>
    <p class="note" id="overSub"></p>
    <div class="unlock" id="overUnlock" hidden></div>
    <button class="btn sun" id="againBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg><span id="againLbl">Rematch</span></button>
    <div class="row2"><button class="btn ghost" id="shareBtn">Share</button><button class="btn ghost" id="menuBtn">Menu</button></div>
  </div>
</div>
<div class="screen" id="pause" hidden>
  <div class="card">
    <h2 class="big">Paused</h2>
    <button class="btn sun" id="resumeBtn">Resume</button>
    <div class="row2"><button class="btn ghost" id="restartBtn">Restart</button><button class="btn ghost" id="quitBtn">Menu</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const SDK = window.SkerrySDK || { gameplayStart(){}, gameplayStop(){}, happytime(){}, levelEnd(){}, event(){},
  save(k, v){ try { localStorage.setItem("colorclaim." + k, JSON.stringify(v)); } catch (e) {} },
  load(k, d){ try { const v = localStorage.getItem("colorclaim." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } } };
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const SHARE_URL = "https://skerryarcade.com/color-claim/";

/* ---------------- colours ----------------
   Every colour also has a shape, so the game works for colour-blind players too. */
const COLS = [
  { name: "Coral", c: "#FF6B5A", d: "#C9453A", emo: "🟧", shape: "circle" },
  { name: "Sun", c: "#FFD23F", d: "#C9A21F", emo: "🟨", shape: "tri" },
  { name: "Mint", c: "#46E0BE", d: "#26A98B", emo: "🟩", shape: "square" },
  { name: "Sky", c: "#4FA8FF", d: "#2C7BD0", emo: "🟦", shape: "diamond" },
  { name: "Grape", c: "#A77BFF", d: "#7B52D4", emo: "🟪", shape: "star" },
  { name: "Rose", c: "#FF7EB6", d: "#D1508C", emo: "🟥", shape: "plus" },
];
const SHAPE_SVG = {
  circle: '<circle cx="12" cy="12" r="8" fill="currentColor"/>',
  tri: '<path d="M12 3.5 21 19.5H3z" fill="currentColor"/>',
  square: '<rect x="4.5" y="4.5" width="15" height="15" rx="2" fill="currentColor"/>',
  diamond: '<path d="M12 2.5 21.5 12 12 21.5 2.5 12z" fill="currentColor"/>',
  star: '<path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="currentColor"/>',
  plus: '<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="currentColor"/>',
};

/* ---------------- saves ---------------- */
let save = Object.assign({ wins: 0, games: 0, sound: true, beaten: {}, daily: { day: 0, best: 0, par: 0 }, streak: { last: 0, n: 0 } }, SDK.load("save", {}));
const store = () => SDK.save("save", save);
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const dayNo = () => { const d = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 10, 1)) / 864e5) + 1; };

/* ---------------- audio ---------------- */
const Sound = (() => {
  let ctx = null, master = null;
  function init(){ if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = save.sound ? .8 : 0; master.connect(ctx.destination); } catch (e) { ctx = null; } }
  const ok = () => ctx && save.sound;
  function tone(f, t, dur, type, vol, to){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05); }
  const NOTES = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  return { init,
    setOn(on){ if (master) master.gain.setTargetAtTime(on ? .8 : 0, ctx.currentTime, .02); },
    pick(){ if (!ok()) return; const t = ctx.currentTime; tone(520, t, .08, "triangle", .14, 780); },
    // a rising run: the more tiles you swallow, the longer the run
    claim(n, base){ if (!ok()) return; const t = ctx.currentTime, k = Math.min(10, n);
      for (let i = 0; i <= k; i++) tone(base * Math.pow(2, NOTES[i] / 12), t + i * .045, .22, "triangle", .07 + .01 * Math.min(i, 5)); },
    none(){ if (!ok()) return; const t = ctx.currentTime; tone(220, t, .18, "sine", .12, 160); },
    win(){ if (!ok()) return; const t = ctx.currentTime; [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * .1, .55, "triangle", .14)); },
    lose(){ if (!ok()) return; const t = ctx.currentTime; [392, 330, 262].forEach((f, i) => tone(f, t + i * .14, .4, "triangle", .13)); },
    click(){ if (!ok()) return; tone(880, ctx.currentTime, .05, "triangle", .09); }
  };
})();
const buzz = p => { try { if (save.sound && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p); } catch (e) {} };

/* ---------------- rivals ---------------- */
const RIVALS = [
  { id: "smudge", name: "Smudge", short: "Smudge", face: "S", color: "#46E0BE", blurb: "Picks what looks nice", style: "loose" },
  { id: "swatch", name: "Swatch", short: "Swatch", face: "W", color: "#FFA53D", blurb: "Grabs the biggest bite", style: "greedy" },
  { id: "chroma", name: "Chroma", short: "Chroma", face: "C", color: "#FF6B9A", blurb: "Thinks four moves ahead", style: "deep" },
];
function rivalUnlocked(i){ return i === 0 || !!save.beaten[RIVALS[i - 1].id]; }
function buildRivals(){
  $("rivals").innerHTML = RIVALS.map((r, i) => '<button class="rival' + (rivalUnlocked(i) ? "" : " locked") + '" data-r="' + i + '">' + (save.beaten[r.id] ? '<span class="star">★</span>' : "") +
    '<span class="face" style="background:' + r.color + '">' + (rivalUnlocked(i) ? r.face : "🔒") + '</span><b>' + r.short + '</b><small>' + (rivalUnlocked(i) ? r.blurb : "Beat " + RIVALS[i - 1].short) + "</small></button>").join("");
}
function beatRival(r){ const first = !save.beaten[r.id]; save.beaten[r.id] = true; store(); const i = RIVALS.indexOf(r); return first && i < RIVALS.length - 1 ? RIVALS[i + 1].name + " unlocked" : ""; }

/* ---------------- the board ----------------
   color[i] is the tile colour, owner[i] is 0 (free), 1 or 2. A player's land is always one colour.
   Picking a colour paints your land and swallows every free tile of that colour touching it, again and again. */
let W = 8, H = 10, N = 80;
let color = [], owner = [], born = [], mode = "bot", rival = RIVALS[0], turn = 1, state = "menu", moves = 0, trail = [], par = 0, busy = false, time = 0;
const START = { 1: () => (H - 1) * W, 2: () => W - 1 };
function neighbours(i){ const x = i % W, y = (i / W) | 0, out = []; if (x > 0) out.push(i - 1); if (x < W - 1) out.push(i + 1); if (y > 0) out.push(i - W); if (y < H - 1) out.push(i + W); return out; }
let NB = [];
function makeBoard(seed, w, h, players){
  W = w; H = h; N = W * H; const r = rng(seed);
  NB = []; for (let i = 0; i < N; i++) NB.push(neighbours(i));
  color = new Array(N); owner = new Array(N).fill(0); born = new Array(N).fill(-9);
  for (let i = 0; i < N; i++) { const x = i % W, y = (i / W) | 0; let c;

  $("sWins").textContent = save.wins; $("sStreak").textContent = save.streak.last >= d - 1 ? save.streak.n : 0;
  $("sDaily").textContent = played ? save.daily.best + "/" + save.daily.par : "–";
  $("playLbl").textContent = "Play " + nextRival().name;
  $("dailyName").textContent = "Daily flood #" + d;
  $("dailySub").textContent = played ? "Best today " + save.daily.best + " moves, par " + save.daily.par + " · try again" : "Fill the whole board in par or less";
  demoBoard();
}
function demoBoard(){ mode = "bot"; makeBoard(4242, 8, 10, 2); for (let k = 0; k < 6; k++) { applyMove(color, owner, 1, legal(1)[k % 3]); applyMove(color, owner, 2, legal(2)[(k + 1) % 3]); }
  players = [{ name: "", color: "#FFD23F" }, { name: "", color: "#46E0BE" }]; for (let i = 0; i < N; i++) born[i] = -9; layout(); }
function toMenu(){ if (state === "play" || state === "pause") SDK.gameplayStop(); state = "menu"; $("hud").hidden = true; $("palA").hidden = $("palB").hidden = true; $("movesTxt").hidden = true; refreshMenu(); show("menu"); }
function pause(){ if (state !== "play") return; state = "pause"; SDK.gameplayStop(); show("pause"); }
function resume(){ if (state !== "pause") return; state = "play"; show(null); SDK.gameplayStart(); maybeBot(); }
async function share(){
  let text;
  if (mode === "daily") text = "Color Claim Daily #" + dayNo() + (moves <= par ? " ✅ " : " ") + moves + "/" + par + " moves\n" + trail.map(c => COLS[c].emo).join("") + "\n" + SHARE_URL;
  else if (mode === "bot") text = "Color Claim: " + $("overTitle").textContent + " " + $("overScore").textContent + " vs " + rival.name + " 🎨 Can you beat " + rival.name + "?\n" + SHARE_URL;
  else text = "Color Claim face to face: " + $("overTitle").textContent + " " + $("overScore").textContent + " 🎨\n" + SHARE_URL;
  SDK.event("share", { mode });
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it to a friend"); } catch (e) { toast(text); }
}
function soundIcon(){ $("soundBtn").innerHTML = save.sound ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>'; }
function toggleSound(){ save.sound = !save.sound; store(); Sound.setOn(save.sound); soundIcon(); }

/* ---------------- input ---------------- */
const tap = (id, fn) => $(id).addEventListener("click", e => { e.stopPropagation(); Sound.init(); fn(); });
tap("playBtn", () => startGame("bot", nextRival())); tap("dailyBtn", () => startGame("daily")); tap("duoBtn", () => startGame("duo"));
tap("againBtn", () => startGame(mode, rival)); tap("menuBtn", toMenu); tap("shareBtn", share);
tap("pauseBtn", pause); tap("resumeBtn", resume); tap("restartBtn", () => startGame(mode, rival)); tap("quitBtn", toMenu); tap("soundBtn", toggleSound);
$("rivals").addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (!b) return; Sound.init(); const i = +b.dataset.r;
  if (!rivalUnlocked(i)) { toast("Beat " + RIVALS[i - 1].name + " first"); return; } startGame("bot", RIVALS[i]); });
// tapping a tile on the board picks its colour (a quick way to play on a big screen)
cv.addEventListener("pointerdown", e => { Sound.init(); if (state !== "play") return;
  const cx = Math.floor((e.clientX - OX) / CS), cy = Math.floor((e.clientY - OY) / CS); if (cx < 0 || cy < 0 || cx >= W || cy >= H) return;
  const p = mode === "duo" ? turn : 1; if (players[p - 1].bot) return; pick(p, color[cy * W + cx]); });
addEventListener("keydown", e => { Sound.init();
  if (e.code === "KeyP" || e.code === "Escape") state === "play" ? pause() : state === "pause" && resume();
  if (e.code === "KeyM") toggleSound();
  const n = parseInt(e.key, 10); if (state === "play" && n >= 1 && n <= 6) { const p = mode === "duo" ? turn : 1; if (!players[p - 1].bot) pick(p, n - 1); } });
addEventListener("resize", layout);
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

let last = performance.now();
function frame(now){ const dt = Math.min(.05, (now - last) / 1000); last = now; if (state !== "pause") time += dt; render(dt); requestAnimationFrame(frame); }
layout(); soundIcon(); toMenu();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
if (/[?&]debug=1/.test(location.search)) window.__cc = { RIVALS, startGame, pick, legal, botPick, gainFor: c => gainFor(color, owner, 1, c), get state(){ return state; }, get turn(){ return turn; }, get busy(){ return busy; }, get moves(){ return moves; }, get par(){ return par; }, count, get mode(){ return mode; } };
})();
