<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sea Glass Sort: sort the colours, collect the stars</title>
<meta name="description" content="Pour sea glass between jars until every jar holds one colour. Hundreds of levels, three stars to chase on each, a daily puzzle and duels against a friend or the computer.">
<meta name="theme-color" content="#0E4C5C">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<script src="/assets/skerry-sdk.js"></script>
<style>
  :root{
    --ink:#0A3340; --panel:rgba(6,40,52,.86); --line:rgba(220,250,255,.18);
    --text:#F4FDFF; --muted:#A8D3DC; --sun:#FFD23F; --sun-ink:#231A00; --mint:#46E0BE; --coral:#FF7A5C;
    --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Familjen Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:500 16px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  [hidden]{display:none!important}

  .hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:2;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .hud > *{pointer-events:auto}
  .lv{flex:1;min-width:0;display:grid;gap:2px}
  .lv small{font:700 .64rem/1 var(--f-display);letter-spacing:.16em;color:#fff;opacity:.85;text-shadow:0 1px 6px rgba(0,30,40,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv b{font:800 1.45rem/1.05 var(--f-display);white-space:nowrap;text-shadow:0 2px 10px rgba(0,30,40,.45)}
  .mv{display:grid;justify-items:center;gap:2px;padding:6px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:76px}
  .mv small{font:700 .58rem/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
  .mv b{font:800 1.25rem/1 var(--f-display);font-variant-numeric:tabular-nums}
  .mv span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .ibtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
  .ibtn svg{width:18px;height:18px}
  .tools{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:2}
  .tool{position:relative;height:48px;min-width:64px;padding:0 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:1px solid var(--line);font:700 .78rem/1 var(--f-display)}
  .tool svg{width:18px;height:18px}
  .tool i{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--sun);color:var(--sun-ink);font:800 .66rem/20px var(--f-display);font-style:normal}
  .tool:disabled{opacity:.4}
  .turn{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:800 .78rem/1 var(--f-display);padding:8px 14px;border-radius:999px;background:var(--c,#FFD23F);color:#1E1400;pointer-events:none;z-index:3;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .pop{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);font:800 clamp(1.7rem,8vw,2.6rem)/1.05 var(--f-display);color:#fff;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:4;white-space:nowrap}
  .pop small{display:block;font:700 .78rem/1 var(--f-display);letter-spacing:.22em;margin-bottom:8px;color:var(--sun)}
  .pop.show{animation:popin 1.5s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}26%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}

  .screen{position:fixed;inset:0;display:flex;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(110% 70% at 50% 15%,rgba(120,240,220,.2),transparent 60%),rgba(4,30,40,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
  .card{margin:auto;width:min(420px,100%);display:grid;gap:13px;justify-items:center;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  .logo{margin:0;font:800 clamp(2.5rem,12.5vw,3.6rem)/.9 var(--f-display);letter-spacing:-.03em;color:#fff;text-shadow:0 5px 0 #11807A,0 12px 34px rgba(0,0,0,.35)}
  .logo span{display:block;font-size:.36em;letter-spacing:.42em;margin-top:.7em;color:var(--sun);text-shadow:none}
  .lead{margin:0;color:#DDF6FA;max-width:31ch}
  .shores{width:100%;display:grid;gap:8px;padding:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .shores p{margin:0;display:flex;justify-content:space-between;font:700 .7rem/1 var(--f-display);letter-spacing:.12em;color:var(--muted)}
  .shores p b{color:var(--sun)}
  .shl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .sh{display:grid;gap:4px;justify-items:center;font:700 .56rem/1.15 var(--f-display);color:var(--muted)}
  .sh i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:1rem;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12)}
  .sh.on i{border-color:var(--sun);background:rgba(255,210,63,.18)}
  .sh.done i{border-color:var(--mint);background:rgba(70,224,190,.2)}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:99px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:18px;font:800 1rem/1 var(--f-display);transition:transform .12s,box-shadow .12s}
  .btn svg{width:18px;height:18px}
  .btn span{display:grid;gap:3px}
  .btn small{font:600 .74rem/1 var(--f-body);opacity:.8}
  .btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 #C89A00,0 14px 30px -8px rgba(255,210,63,.55)}
  .btn.sun:active{transform:translateY(4px);box-shadow:0 2px 0 #C89A00}
  .btn.daily{height:auto;min-height:56px;padding:9px 14px;background:linear-gradient(135deg,#1C8FA8,#46E0BE);color:#032A33;box-shadow:0 5px 0 #127083}
  .btn.daily:active{transform:translateY(3px);box-shadow:0 2px 0 #127083}
  .btn.daily b{font:800 .95rem/1 var(--f-display)}
  .btn.daily small{font:600 .74rem/1.1 var(--f-body);opacity:.85}
  .btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);height:50px;font-size:.88rem}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .big{font:800 clamp(2.2rem,11vw,3.2rem)/1.02 var(--f-display);margin:0}
  .kicker{font:700 .76rem/1 var(--f-display);letter-spacing:.2em;color:var(--muted);margin:0}
  .note{font-size:.82rem;color:var(--muted);margin:0}
  .stars{display:flex;gap:10px;justify-content:center}
  .stars svg{width:52px;height:52px;color:rgba(255,255,255,.15);transform:scale(.6);opacity:.4;transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s,color .2s}
  .stars svg.on{color:var(--sun);transform:scale(1);opacity:1;filter:drop-shadow(0 4px 14px rgba(255,210,63,.6))}
  .stars svg:nth-child(2){transform:scale(.6) translateY(-8px)}
  .stars svg.on:nth-child(2){transform:scale(1.18) translateY(-8px)}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;z-index:9;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .vs{width:100%;display:grid;gap:8px}
  .vs .vlabel{font:700 .7rem/1 var(--f-display);letter-spacing:.16em;color:var(--muted);text-align:left;margin:4px 0 0}
  .rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rival{position:relative;display:grid;gap:4px;justify-items:center;padding:10px 6px 9px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .12s}
  .rival:active{transform:scale(.96)}
  .rival .face{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 1rem/1 var(--f-display);color:#1E1400;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .rival b{font:700 .78rem/1.1 var(--f-display)}
  .rival small{font-size:.68rem;color:var(--muted);line-height:1.2}
  .rival.locked{opacity:.45}
  .rival .star{position:absolute;top:5px;right:8px;color:var(--sun);font-size:.85rem}
  .btn.duo2{background:rgba(255,255,255,.08);border:1px solid var(--line);height:50px;font-size:.88rem}
  .btn.duo2 svg{width:20px;height:20px}

  @media (max-height:700px){.lead{display:none}.card{gap:9px}.logo{font-size:2.3rem}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div class="hud" id="hud" hidden>

  <div class="mv"><small>MOVES</small><b id="moves">0</b><span id="par">par 10</span></div>
  <button class="ibtn" id="soundBtn" aria-label="Sound on or off"></button>
</div>
<div class="tools" id="tools" hidden>
  <button class="tool" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo<i id="undoN">5</i></button>
  <button class="tool" id="restartBtn" aria-label="Restart level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>Restart</button>
  <button class="tool" id="jarBtn" aria-label="Add an empty jar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 3h8M9 3v3c-2 1-3 3-3 5v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8c0-2-1-4-3-5V3"/><path d="M12 11v6M9 14h6"/></svg>Jar<i id="jarN">1</i></button>
</div>

<div class="screen" id="menu">
  <div class="card">
    <h1 class="logo">SEA GLASS<span>SORT</span></h1>

    <div class="shores">

    <button class="btn sun" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg><span><b id="playLbl">Play level 1</b><small id="playSub">3 colours</small></span></button>
    <button class="btn daily" id="dailyBtn"><span><b id="dailyName">Daily puzzle</b><small id="dailySub">Same jars for everyone today</small></span></button>
    <div class="vs">
      <p class="vlabel">VERSUS</p>
      <div class="rivals" id="rivals"></div>
      <button class="btn duo2" id="duoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5M13.6 14.4c.9-.6 1.9-.9 2.9-.9 2.3 0 4.2 1.5 4.7 4.5"/></svg>2 players, same jars</button>
    </div>

</div>
<div class="screen" id="win" hidden>
  <div class="card">
    <p class="kicker" id="winKick">LEVEL 1</p>
    <div class="stars" id="stars">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
    </div>

    <button class="btn sun" id="nextBtn"><span id="nextLbl">Next level</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>

</div>

  <div class="card">
    <p class="kicker" id="tcKick">DUEL</p>
    <h2 class="big" id="tcBig">Player 2</h2>
    <p class="note" id="tcSub"></p>
    <button class="btn sun" id="tcBtn">Start</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const SDK = window.SkerrySDK || { gameplayStart(){}, gameplayStop(){}, happytime(){}, levelEnd(){}, event(){},
  save(k, v){ try { localStorage.setItem("seaglass." + k, JSON.stringify(v)); } catch (e) {} },
  load(k, d){ try { const v = localStorage.getItem("seaglass." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } } };
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const SHARE_URL = "https://skerryarcade.com/sea-glass-sort/";
/* ---------------- puzzle core: generation and solving ----------------
   A jar is an array of colour ids, bottom first. CAP pieces fit in a jar. */
const CAP = 4;
function rngS(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const topRun = j => { if (!j.length) return 0; const c = j[j.length - 1]; let n = 0; for (let i = j.length - 1; i >= 0 && j[i] === c; i--) n++; return n; };
const uniform = j => j.length > 0 && j.every(c => c === j[0]);
function canPour(s, i, j){
  if (i === j) return 0; const a = s[i], b = s[j];
  if (!a.length || b.length >= CAP) return 0;
  if (b.length && b[b.length - 1] !== a[a.length - 1]) return 0;
  return Math.min(topRun(a), CAP - b.length);
}
function pour(s, i, j){ const n = canPour(s, i, j); if (!n) return 0; for (let k = 0; k < n; k++) s[j].push(s[i].pop()); return n; }
const solved = s => s.every(j => j.length === 0 || (j.length === CAP && uniform(j)));
const keyOf = s => s.map(j => j.join(",")).sort().join("|");
function heur(s){ let segs = 0; const seen = new Map(); for (const j of s) { for (let i = 0; i < j.length; i++) if (i === 0 || j[i] !== j[i - 1]) { segs++; seen.set(j[i], (seen.get(j[i]) || 0) + 1); } }
  return segs - seen.size; }
// moves worth considering: no pouring a finished or single-colour jar into an empty one
function movesOf(s){
  const out = [];
  for (let i = 0; i < s.length; i++) { const a = s[i]; if (!a.length || (a.length === CAP && uniform(a))) continue;
    let emptyDone = false;
    for (let j = 0; j < s.length; j++) { const n = canPour(s, i, j); if (!n) continue;
      if (!s[j].length) { if (uniform(a) || emptyDone) continue; emptyDone = true; }
      if (s[j].length && n < topRun(a) && !uniform(s[j])) continue;       // splitting a run onto a mixed jar rarely helps
      out.push([i, j]); } }
  return out;
}
// weighted best-first search; returns a list of [from, to] moves or null
function solve(start, cap = 60000, w = 2.2){
  const clone = s => s.map(j => j.slice());
  const heap = [], push = n => { heap.push(n); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p].f <= heap[i].f) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l].f < heap[m].f) m = l; if (r < heap.length && heap[r].f < heap[m].f) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  const seen = new Map(); push({ s: clone(start), g: 0, f: 0, path: null }); seen.set(keyOf(start), 0);
  let n = 0;
  while (heap.length && n++ < cap) {
    const cur = pop();
    if (solved(cur.s)) { const out = []; for (let p = cur.path; p; p = p.prev) out.push(p.m); return out.reverse(); }
    for (const m of movesOf(cur.s)) { const s2 = clone(cur.s); pour(s2, m[0], m[1]); const k = keyOf(s2), g = cur.g + 1;
      if (seen.has(k) && seen.get(k) <= g) continue; seen.set(k, g); push({ s: s2, g, f: g + w * heur(s2), path: { m, prev: cur.path } }); }
  }
  return null;
}
function makePuzzle(colors, empties, seed){
  for (let tries = 0; tries < 40; tries++) {
    const r = rngS(seed + tries * 7919), pieces = [];
    for (let c = 0; c < colors; c++) for (let k = 0; k < CAP; k++) pieces.push(c);
    for (let i = pieces.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; }
    const s = []; for (let c = 0; c < colors; c++) s.push(pieces.slice(c * CAP, c * CAP + CAP));
    for (let e = 0; e < empties; e++) s.push([]);
    // reject boards that start with a finished jar or three of a kind on top
    if (s.some(j => j.length === CAP && uniform(j)) || s.some(j => topRun(j) >= 3)) continue;
    let best = null;
    for (const w of [2.2, 1.6, 3]) { const sol = solve(s, colors > 9 ? 45000 : 60000, w); if (sol && (!best || sol.length < best.length)) best = sol; if (best && colors <= 5) break; }
    if (best) return { jars: s, par: best.length, solution: best };
  }
  return null;
}
if (typeof module !== "undefined") module.exports = { CAP, makePuzzle, solve, canPour, pour, solved, movesOf };


/* ---------------- content ---------------- */
const COLORS = [
  { c: "#2EC4B6", s: "dot" }, { c: "#3A6FF7", s: "ring" }, { c: "#F4A62A", s: "tri" }, { c: "#F25F9A", s: "heart" },
  { c: "#8BD346", s: "leaf" }, { c: "#A77BF3", s: "diamond" }, { c: "#FF6B4A", s: "square" }, { c: "#E9F1F7", s: "wave" },
  { c: "#FFD93D", s: "star" }, { c: "#1E9E5A", s: "plus" }, { c: "#9A6440", s: "bars" }, { c: "#4A4E69", s: "x" },
];
const SHORES = [
  { name: "Driftwood Beach", icon: "🪵", sky: ["#7FD3E0", "#2B8FA8"], sand: "#F2DDA4" },
