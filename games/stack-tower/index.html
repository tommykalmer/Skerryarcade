<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stack Tower: tap to stack the tallest tower</title>
<meta name="description" content="One tap, one block. Drop each sliding block onto the tower, trim the overhang and chain perfect drops to grow it back. How high can you stack?">
<meta name="theme-color" content="#0E5E78">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<script src="/assets/skerry-sdk.js"></script>
<style>
  :root{
    --ink:#082F3E; --panel:rgba(6,32,44,.82); --line:rgba(230,250,255,.18);
    --text:#F6FDFF; --muted:#B4D8E2; --sun:#FFD23F; --sun-ink:#231A00; --mint:#46E0BE;
    --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Familjen Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:500 16px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  [hidden]{display:none!important}

  .score{position:fixed;left:0;right:0;top:calc(18px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;z-index:2}
  .score b{display:block;font:800 clamp(3.4rem,17vw,5.2rem)/1 var(--f-display);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.14),0 10px 40px rgba(0,0,0,.25);transition:transform .12s}
  .score b.bump{transform:scale(1.12)}
  .score span{display:block;margin-top:6px;font:700 .8rem/1 var(--f-display);letter-spacing:.14em;color:rgba(255,255,255,.75);text-shadow:0 2px 10px rgba(0,0,0,.3)}
  .combo{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:800 1.05rem/1 var(--f-display);letter-spacing:.06em;color:#fff;
    padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events:none;opacity:0;z-index:2;white-space:nowrap}
  .combo.show{animation:combo 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes combo{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}30%{transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
  .ibtns{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:8px;z-index:3}
  .ibtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
  .ibtn svg{width:19px;height:19px}
  .hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font:600 .95rem/1.2 var(--f-body);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none;transition:opacity .5s;z-index:2}
  .hint b{display:inline-block;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07);opacity:.75}}

  .screen{position:fixed;inset:0;display:flex;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(4,24,34,.25),rgba(4,24,34,.72) 55%,rgba(4,24,34,.88));z-index:5}
  .card{margin:auto auto 4vh;width:min(420px,100%);display:grid;gap:14px;justify-items:center;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .logo{margin:0;font:800 clamp(2.8rem,14vw,4rem)/.88 var(--f-display);letter-spacing:-.03em;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.18),0 14px 40px rgba(0,0,0,.3)}
  .logo span{display:block;font-size:.34em;letter-spacing:.4em;margin-top:.7em;color:var(--sun);text-shadow:none}
  .lead{margin:0;color:#E4F6FA;max-width:30ch}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  .stat{background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:grid;gap:2px}
  .stat b{font:800 1.15rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
  .stat small{font-size:.72rem;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:18px;font:800 1rem/1 var(--f-display);transition:transform .12s,box-shadow .12s}
  .btn svg{width:18px;height:18px}
  .btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 #C89A00,0 14px 30px -8px rgba(255,210,63,.6)}
  .btn.sun:active{transform:translateY(4px);box-shadow:0 2px 0 #C89A00}
  .btn.ghost{background:rgba(255,255,255,.1);border:1px solid var(--line);height:50px;font-size:.88rem}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .note{font-size:.8rem;color:var(--muted);margin:0}
  .big{font:800 clamp(3.4rem,18vw,5rem)/1 var(--f-display);margin:0;font-variant-numeric:tabular-nums}
  .kicker{font:700 .78rem/1 var(--f-display);letter-spacing:.2em;color:var(--muted);margin:0}
  .badge{font:800 .8rem/1 var(--f-display);letter-spacing:.06em;padding:8px 12px;border-radius:999px;background:var(--sun);color:var(--sun-ink)}
  .themes{width:100%;display:grid;gap:8px}
  .themes p{margin:0;font:700 .72rem/1 var(--f-display);letter-spacing:.16em;color:var(--muted)}
  .swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .sw{position:relative;width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.2);overflow:hidden;transition:transform .12s}
  .sw:active{transform:scale(.92)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  .sw i{position:absolute;inset:0}
  .sw.locked i{filter:grayscale(.85) brightness(.55)}
  .sw svg{position:absolute;inset:0;margin:auto;width:16px;height:16px;color:#fff}
  .unlock{font:700 .85rem/1.3 var(--f-body);color:#fff;background:linear-gradient(90deg,rgba(70,224,190,.25),rgba(255,210,63,.25));border:1px solid var(--line);padding:10px 14px;border-radius:14px;width:100%}

  .vs{width:100%;display:grid;gap:8px}
  .vs .vlabel{font:700 .7rem/1 var(--f-display);letter-spacing:.16em;color:var(--muted);text-align:left;margin:4px 0 0}
  .rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rival{position:relative;display:grid;gap:4px;justify-items:center;padding:10px 6px 9px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .12s}
  .rival:active{transform:scale(.96)}
  .rival .face{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 1rem/1 var(--f-display);color:#1E1400;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .rival b{font:700 .78rem/1.1 var(--f-display)}
  .rival small{font-size:.68rem;color:var(--muted);line-height:1.2}
  .rival.locked{opacity:.45}
  .rival .star{position:absolute;top:5px;right:8px;color:var(--sun);font-size:.85rem}
  .btn.duo2{background:rgba(255,255,255,.08);border:1px solid var(--line);height:50px;font-size:.88rem}
  .btn.duo2 svg{width:20px;height:20px}
  .turn{position:fixed;left:50%;top:calc(112px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:800 .82rem/1 var(--f-display);letter-spacing:.04em;padding:8px 14px;border-radius:999px;background:var(--c,#FFD23F);color:#1E1400;pointer-events:none;z-index:2;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:background .2s}
  .turn.pulse{animation:tp .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes tp{0%{transform:translateX(-50%) scale(.8)}100%{transform:translateX(-50%) scale(1)}}
  .who{font:800 clamp(1.9rem,9vw,2.6rem)/1.05 var(--f-display);margin:0}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;z-index:9;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-height:640px){.lead{display:none}.card{gap:10px}.logo{font-size:2.4rem}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Stack Tower"></canvas>
<div class="score" id="scoreBox" hidden><b id="score">0</b><span id="scoreSub">BEST 0</span></div>
<div class="combo" id="combo"></div>
<div class="turn" id="turn" hidden></div>
<div class="ibtns" id="ibtns">
  <button class="ibtn" id="soundBtn" aria-label="Sound on or off"></button>
</div>
<div class="hint" id="hint" hidden><b>Tap to drop</b></div>

<div class="screen" id="menu">
  <div class="card">
    <h1 class="logo">STACK<br>TOWER<span>ONE TAP</span></h1>
    <p class="lead">Drop each sliding block on the tower. Whatever hangs over is cut off. Land it perfectly to keep it whole.</p>
    <div class="stats">
      <div class="stat"><b id="sBest">0</b><small>Best height</small></div>
      <div class="stat"><b id="sPerf">0</b><small>Perfect streak</small></div>
      <div class="stat"><b id="sGames">0</b><small>Towers built</small></div>
    </div>
    <button class="btn sun" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>Play</button>
    <div class="vs">
      <p class="vlabel">VERSUS</p>
      <div class="rivals" id="rivals"></div>
      <button class="btn duo2" id="duoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5M13.6 14.4c.9-.6 1.9-.9 2.9-.9 2.3 0 4.2 1.5 4.7 4.5"/></svg>2 players, one tower</button>
    </div>
    <div class="themes"><p>TOWER STYLE</p><div class="swatches" id="swatches"></div></div>
    <p class="note" id="themeNote">Tap, click or press Space to drop a block.</p>
  </div>
</div>

<div class="screen" id="over" hidden>
  <div class="card">
    <p class="kicker" id="overKick">YOUR TOWER</p>
    <h2 class="big" id="overScore">0</h2>
    <h2 class="who" id="overWho" hidden></h2>
    <span class="badge" id="overBadge" hidden>NEW BEST!</span>
    <p class="note" id="overSub"></p>
    <div class="unlock" id="overUnlock" hidden></div>
    <button class="btn sun" id="againBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>Play again</button>
    <div class="row2"><button class="btn ghost" id="shareBtn">Share</button><button class="btn ghost" id="menuBtn">Menu</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const SDK = window.SkerrySDK || { gameplayStart(){}, gameplayStop(){}, happytime(){}, levelEnd(){}, event(){},
  save(k, v){ try { localStorage.setItem("stacktower." + k, JSON.stringify(v)); } catch (e) {} },
  load(k, d){ try { const v = localStorage.getItem("stacktower." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } } };
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const SHARE_URL = "https://skerryarcade.com/stack-tower/";

/* ---------------- tuning ----------------
   World units: the base is 100 x 100, each slab is SLAB tall. x and z are the two horizontal axes. */
const BASE = 100, SLAB = 13, RANGE = 135;
const speedAt = n => Math.min(330, 118 + n * 2.6);
const perfectTol = n => Math.max(2.4, 4.2 - n * .015);
const GROW_AFTER = 3, GROW_BY = 5;      // from the 3rd perfect in a row, each perfect grows the block back a little

/* ---------------- tower styles ---------------- */
const hsl = (h, s, l) => "hsl(" + ((h % 360) + 360) % 360 + "," + s + "%," + l + "%)";
const THEMES = [
  { id: "lagoon", name: "Lagoon", need: null,
    block: i => [172 + i * 4.2, 62, 58], sky: y => [[188 - y * .06, 62, 62 - y * .06], [205 + y * .03, 70, 34 - y * .04]], stars: 180 },
  { id: "sunset", name: "Sunset", need: { best: 15 }, text: "Stack 15 to unlock",
    block: i => [18 - i * 3.4, 82, 62], sky: y => [[28 - y * .08, 90, 70 - y * .07], [330 - y * .05, 55, 38 - y * .05]], stars: 150 },
  { id: "candy", name: "Candy", need: { best: 30 }, text: "Stack 30 to unlock",
    block: i => [330 + i * 11, 78, 76], sky: y => [[300 + y * .05, 70, 86 - y * .04], [200 + y * .05, 70, 74 - y * .05]], stars: 260 },
  { id: "aurora", name: "Aurora", need: { perf: 8 }, text: "8 perfect drops in a row to unlock",
    block: i => [140 + Math.sin(i * .18) * 60 + i * 1.5, 72, 58], sky: y => [[230, 50, 18], [258, 55, 8]], stars: 0, aurora: true },
  { id: "glacier", name: "Glacier", need: { best: 50 }, text: "Stack 50 to unlock",
    block: i => [192 + Math.sin(i * .3) * 14, 55, 84 - (i % 2) * 5], sky: y => [[200, 60, 92 - y * .05], [212, 55, 70 - y * .06]], stars: 220 },
  { id: "neon", name: "Neon", need: { best: 75 }, text: "Stack 75 to unlock",
    block: i => [i * 23 + 290, 100, 58], sky: y => [[262, 60, 10], [290, 70, 4]], stars: 0, neon: true },
];

/* ---------------- saves ---------------- */
let save = Object.assign({ best: 0, perf: 0, games: 0, blocks: 0, theme: "lagoon", sound: true, unlocked: ["lagoon"] }, SDK.load("save", {}));
const store = () => SDK.save("save", save);
const isUnlocked = t => !t.need || (t.need.best && save.best >= t.need.best) || (t.need.perf && save.perf >= t.need.perf);
let theme = THEMES.find(t => t.id === save.theme && isUnlocked(t)) || THEMES[0];

/* ---------------- audio ----------------
   Each perfect drop climbs a pentatonic scale, so a long perfect run plays a little tune. */
const Sound = (() => {
  let ctx = null, master = null, verb = null;
  function init(){ if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = save.sound ? .8 : 0; master.connect(ctx.destination);
      // short airy echo for the perfect notes
      verb = ctx.createDelay(); verb.delayTime.value = .13; const fb = ctx.createGain(); fb.gain.value = .28; const vg = ctx.createGain(); vg.gain.value = .35;
      verb.connect(fb); fb.connect(verb); verb.connect(vg); vg.connect(master);
    } catch (e) { ctx = null; } }
  const ok = () => ctx && save.sound;
  function tone(f, t, dur, type, vol, to, wet){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(master); if (wet) g.connect(verb); o.start(t); o.stop(t + dur + .05); }
  function noise(t, dur, vol, f, type = "bandpass", q = 1){ const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t); }
  const SCALE = [0, 2, 4, 7, 9];
  const note = k => 392 * Math.pow(2, (SCALE[k % 5] + 12 * Math.floor(k / 5)) / 12);
  return { init,
    setOn(on){ if (master) master.gain.setTargetAtTime(on ? .8 : 0, ctx.currentTime, .02); },
    place(){ if (!ok()) return; const t = ctx.currentTime; tone(150, t, .12, "sine", .5, 70); noise(t, .05, .18, 1800); },
    cut(){ if (!ok()) return; const t = ctx.currentTime; tone(130, t, .1, "sine", .4, 60); noise(t, .12, .22, 900, "lowpass"); },
    perfect(k){ if (!ok()) return; const t = ctx.currentTime, f = note(Math.min(k, 14)); tone(150, t, .1, "sine", .4, 80); tone(f, t, .45, "triangle", .2, 0, true); tone(f * 2, t + .02, .3, "sine", .07, 0, true); },
    grow(){ if (!ok()) return; const t = ctx.currentTime; tone(660, t, .2, "sine", .12, 1320, true); },
    fall(){ if (!ok()) return; const t = ctx.currentTime; tone(320, t, .6, "triangle", .16, 70); noise(t + .25, .4, .15, 400, "lowpass"); },
    best(){ if (!ok()) return; const t = ctx.currentTime; [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * .09, .5, "triangle", .14, 0, true)); },
    click(){ if (!ok()) return; tone(880, ctx.currentTime, .05, "triangle", .1); }
  };
})();
const buzz = p => { try { if (save.sound && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p); } catch (e) {} };


/* ---------------- rivals: shared picker ---------------- */
function rivalUnlocked(i){ return i === 0 || !!(save.beaten || {})[RIVALS[i - 1].id]; }
function buildRivals(){
  const box = $("rivals"); if (!box) return; save.beaten = save.beaten || {};
  box.innerHTML = RIVALS.map((r, i) => '<button class="rival' + (rivalUnlocked(i) ? "" : " locked") + '" data-r="' + i + '">' + (save.beaten[r.id] ? '<span class="star">★</span>' : "") +
    '<span class="face" style="background:' + r.color + '">' + (rivalUnlocked(i) ? r.face : "🔒") + '</span><b>' + r.short + '</b><small>' + (rivalUnlocked(i) ? r.blurb : "Beat " + RIVALS[i - 1].short) + "</small></button>").join("");
}
function onRival(fn){ $("rivals").addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (!b) return; e.stopPropagation(); try { Sound.init(); } catch (_) {}
  const i = +b.dataset.r; if (!rivalUnlocked(i)) { toast("Beat " + RIVALS[i - 1].name + " first"); return; } fn(RIVALS[i]); }); }
function beatRival(r){ save.beaten = save.beaten || {}; const first = !save.beaten[r.id]; save.beaten[r.id] = true; store(); const i = RIVALS.indexOf(r);
  return first && i < RIVALS.length - 1 ? RIVALS[i + 1].name + " unlocked" : ""; }
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

const RIVALS = [
  { id: "pebble", name: "Pebble", short: "Pebble", face: "P", color: "#46E0BE", blurb: "Taps a bit early", k: 8.5, perf: .1 },
  { id: "mason", name: "Mason", short: "Mason", face: "M", color: "#FFA53D", blurb: "Steady hands", k: 4.6, perf: .3 },
  { id: "spire", name: "The Spire", short: "Spire", face: "S", color: "#FF6B9A", blurb: "Lives for perfects", k: 2.6, perf: .55 },
];
let mode = "solo", rival = RIVALS[0], players = [], turn = 0, botAim = null;
const duel = () => mode !== "solo";
// the computer picks where it will let go as each block appears; faster blocks make its timing worse
function botPlanDrop(){
  if (!cur) return; const top = stack[stack.length - 1], sp = cur.speed / 150;
  const err = Math.random() < rival.perf / Math.max(1, sp) ? (Math.random() - .5) * perfectTol(score) * 1.2 : gauss() * rival.k * sp;
  botAim = { at: top[axis] + err, wait: .35 + Math.random() * .5, last: cur[axis] };
}
function botTick(dt){
  if (!cur || !botAim) return;
  botAim.wait -= dt; const now = cur[axis], prev = botAim.last; botAim.last = now;
  if (botAim.wait > 0) return;
  if ((prev - botAim.at) * (now - botAim.at) <= 0) { cur[axis] = botAim.at; inputLock = 0; botAim = null; drop(true); }
}
function setTurn(){
  const t = $("turn"); if (!duel() || state !== "play") { t.hidden = true; return; }
  const p = players[turn]; t.hidden = false; t.style.setProperty("--c", p.color);
  t.textContent = p.bot ? p.name + " drops…" : mode === "bot" ? "Your drop" : p.name + "'s drop";
  t.classList.remove("pulse"); void t.offsetWidth; t.classList.add("pulse");
  if (players[turn].bot) botPlanDrop(); else botAim = null;
}

/* ---------------- state ---------------- */
let state = "menu";           // menu | play | falling | over
let stack = [], cur = null, debris = [], rings = [], sparks = [];
let score = 0, combo = 0, bestCombo = 0, axis = "x", time = 0, camY = 0, camK = 1, zoomOut = 0, overT = 0, inputLock = 0, newBest = false;
